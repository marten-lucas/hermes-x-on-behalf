name: hermes-x-on-behalf
label: Hermes X-On-Behalf Identity Adapter
kind: standalone
version: 0.2.0
description: >
  Propagates human user identity (X-On-Behalf-Of, X-User-Groups) via contextvars
  to HTTP-based MCP tools (Agentgateway) and Honcho memory peer scopes.
author: Local Development
provides_hooks:
  - pre_tool_call
optional_env:
  - name: HERMES_X_ON_BEHALF_DEBUG
    description: "Set to 1 or true for verbose debug logging"
    prompt: "Enable Debug Logging"
    password: false
  - name: MCP_IDENTITY_FALLBACK_USER
    description: "Fallback user ID when no session context is present (e.g. system cron)"
    prompt: "Fallback User ID"
    password: false