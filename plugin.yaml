name: hermes-x-on-behalf
label: Hermes X-On-Behalf
kind: standalone
version: 0.1.4
description: >
  Propagates a human user's identity (X-On-Behalf-Of, X-User-Groups) from Hermes
  platform sessions to outbound MCP tool requests. The current implementation is
  compatible with the Nextcloud Talk and Deck identity contract used by Hermes
  adapters: source.user_id / source.extra_headers are treated as the canonical
  human request context.
author: Local Development
optional_env:
  - name: HERMES_X_ON_BEHALF_DEBUG
    description: "Set to 1 or true to force verbose plugin debug logging to output"
    prompt: "Enable Debug Logging"
    password: false
  - name: MCP_IDENTITY_FALLBACK_USER
    description: "Fallback user ID when no session context is present (e.g. system cron)"
    prompt: "Fallback User ID"
    password: false
